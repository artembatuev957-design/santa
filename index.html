<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1230">
<title>Тайный Санта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}
:root{
 --night:#070b1c;--night2:#111b3b;--panel:rgba(20,31,66,.58);
 --gold:#f5d58a;--gold2:#ffedc2;--cream:#f7f5ef;--berry:#b83e68;
 --mint:#71d6b0;--line:rgba(255,255,255,.13);--muted:rgba(245,248,255,.68);
 --shadow:0 24px 80px rgba(0,0,0,.34)
}
html,body{margin:0;min-height:100%;scroll-behavior:smooth}
body{
 color:var(--cream);font:400 16px/1.55 Nunito,system-ui,sans-serif;min-height:100vh;overflow-x:hidden;
 background:
  radial-gradient(ellipse at 12% 12%,rgba(63,91,165,.28),transparent 34%),
  radial-gradient(ellipse at 90% 28%,rgba(153,43,87,.18),transparent 30%),
  radial-gradient(ellipse at 50% 100%,rgba(23,100,83,.16),transparent 42%),
  linear-gradient(145deg,#080d20 0%,#101936 48%,#080d20 100%);
 background-attachment:fixed
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.22;
 background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
 background-size:46px 46px;mask-image:linear-gradient(to bottom,black,transparent 85%)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;width:min(100% - 32px,620px);margin:0 auto;padding:142px 0 max(40px,env(safe-area-inset-bottom));text-align:center;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
#demo-hot{position:fixed;left:0;top:0;width:30px;height:30px;z-index:60}
h1{font:400 clamp(39px,8vw,58px)/1.05 'Marck Script',cursive;color:var(--gold2);margin:12px 0;text-shadow:0 8px 35px rgba(245,213,138,.22);letter-spacing:.2px}
h2{font:400 30px 'Marck Script',cursive;color:var(--gold);margin:20px 0 7px;text-align:left}
.sub{color:var(--muted);margin:0 0 10px;letter-spacing:.15px}
label{display:block;margin-top:13px;font-weight:800;color:var(--gold);font-size:13px;letter-spacing:.5px;text-transform:uppercase}
small{display:block;color:var(--muted);font-size:12px}
.card{
 background:linear-gradient(145deg,rgba(34,48,91,.72),rgba(14,23,52,.68));
 border:1px solid rgba(245,213,138,.19);border-radius:25px;padding:22px;margin:17px 0;
 text-align:left;box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.07);
 backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)
}
input,textarea{width:100%;padding:14px 16px;margin:7px 0;border-radius:15px;border:1px solid rgba(255,255,255,.14);background:rgba(5,10,27,.46);color:var(--cream);font:inherit;transition:border-color .2s,background .2s,box-shadow .2s}
input::placeholder,textarea::placeholder{color:rgba(235,240,255,.4)}
textarea{min-height:105px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
input:focus,textarea:focus{border-color:rgba(245,213,138,.6);background:rgba(5,10,27,.68);box-shadow:0 0 0 4px rgba(245,213,138,.08)}
.btn{width:100%;padding:14px 18px;margin:10px 0 0;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:linear-gradient(135deg,#f8df9f,#d9ad58);color:#261b12;font:800 15px Nunito,sans-serif;cursor:pointer;transition:transform .22s,filter .22s,box-shadow .22s;box-shadow:0 9px 24px rgba(215,170,80,.16)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 14px 30px rgba(215,170,80,.22)}
.btn:active{transform:scale(.98)}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn.alt{background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.14);color:#f4e9d4;box-shadow:none}
.btn.alt:hover{background:rgba(255,255,255,.12);box-shadow:0 10px 24px rgba(0,0,0,.15)}
.btn:disabled{opacity:.38;cursor:default;transform:none;box-shadow:none}
.lnk{background:none;border:0;color:#d9dff3;font:700 14px Nunito,sans-serif;text-decoration:none;border-bottom:1px solid rgba(217,223,243,.35);padding:5px 2px;margin:15px 8px 4px;cursor:pointer;transition:color .2s,border-color .2s}
.lnk:hover{color:var(--gold2);border-color:var(--gold)}
.row{display:flex;gap:12px}.row .btn{flex:1}
.room{display:block;width:100%;text-align:left;padding:15px 17px;margin:9px 0;border-radius:17px;background:rgba(255,255,255,.055);border:1px solid var(--line);color:inherit;font:inherit;cursor:pointer;transition:transform .2s,background .2s,border-color .2s}
.room:hover{transform:translateX(4px);background:rgba(255,255,255,.095);border-color:rgba(245,213,138,.35)}
.room b{font-size:15px}.room small{margin-top:3px}
.tree{width:112px;margin:0 auto 5px;display:block;filter:drop-shadow(0 12px 22px rgba(0,0,0,.25))}
.lt circle{animation:tw 1.8s infinite}
.lt circle:nth-child(2n){animation-delay:.5s}.lt circle:nth-child(3n){animation-delay:1s}
@keyframes tw{50%{opacity:.2;filter:brightness(1.8)}}
.scr{animation-duration:.7s;animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
[data-a=rise]{animation-name:rise}@keyframes rise{from{opacity:0;transform:translateY(38px) scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
[data-a=zoom]{animation-name:zoom}@keyframes zoom{from{opacity:0;transform:scale(.94);filter:blur(9px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
[data-a=unfold]{animation-name:unfold;transform-origin:top}@keyframes unfold{from{opacity:0;transform:perspective(900px) rotateX(-24deg) translateY(20px)}to{opacity:1;transform:none}}
[data-a=doors]{animation-name:doors}@keyframes doors{from{clip-path:inset(0 48% 0 48%);opacity:.2;filter:blur(6px)}to{clip-path:inset(0 0 0 0);opacity:1;filter:none}}
[data-a=paper]{animation-name:paper}@keyframes paper{from{opacity:0;transform:translateY(-25px) rotate(-1.5deg)}to{opacity:1;transform:none}}
[data-a=drop]{animation-name:drop}@keyframes drop{from{opacity:0;transform:translateY(-35px) scale(.97)}to{opacity:1;transform:none}}
[data-a=spark]{animation-name:spark}@keyframes spark{from{opacity:0;transform:scale(.9) translateY(16px);filter:brightness(2) blur(8px)}to{opacity:1;transform:none;filter:none}}
.balls{display:flex;flex-wrap:wrap;gap:18px 10px;justify-content:center;margin:25px 0}
.ball{width:88px;background:none;border:0;color:var(--cream);font:inherit;cursor:pointer;transform-origin:top center;transition:transform .2s}
.ball:hover{transform:translateY(-5px) scale(1.04)}
.ball span{display:grid;place-items:center;position:relative;width:62px;height:62px;margin:0 auto 7px;border-radius:50%;font:800 19px Nunito,sans-serif;color:#fff;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.8),transparent 28%),var(--c);opacity:.48;transition:opacity .35s,box-shadow .35s;box-shadow:inset -8px -10px 18px rgba(0,0,0,.16),0 8px 20px rgba(0,0,0,.18)}
.ball span:before{content:"";position:absolute;top:-8px;left:27px;width:8px;height:9px;background:var(--gold);border-radius:3px}
.ball.f span{opacity:1;box-shadow:0 0 25px color-mix(in srgb,var(--c),transparent 52%),inset -8px -10px 18px rgba(0,0,0,.16)}
.ball .x{position:absolute;top:-5px;right:-5px;width:21px;height:21px;border-radius:50%;background:#fff;color:#9b244e;font:800 14px/21px Nunito,sans-serif;font-style:normal}
.ball small{font-size:12px;line-height:1.2;word-break:break-word}
.c0{--c:#c83d66}.c1{--c:#3879d9}.c2{--c:#d6a536}.c3{--c:#299d78}.c4{--c:#925bd0}
.hang{animation:hang .8s cubic-bezier(.3,1.4,.5,1) both,swing 4.2s ease-in-out .8s infinite}
@keyframes hang{from{transform:translateY(-65px) scale(.65);opacity:0}to{opacity:1}}
@keyframes swing{0%,100%{rotate:-1.5deg}50%{rotate:1.5deg}}
.pulse{animation:pl 2.3s infinite;color:#d9e4ff}@keyframes pl{50%{opacity:.42}}
.gb{position:relative;width:176px;height:176px;margin:30px auto 8px;cursor:pointer;filter:drop-shadow(0 15px 24px rgba(0,0,0,.25));transition:transform .3s}
.gb:hover{transform:translateY(-4px) scale(1.03)}
.gb .bd,.gb .ld{position:absolute;left:10px;right:10px}
.gb .bd{bottom:0;height:112px;background:linear-gradient(120deg,#9f2850,#d14c73);border-radius:10px;box-shadow:inset 0 -13px rgba(0,0,0,.13)}
.gb .ld{bottom:108px;left:0;right:0;height:43px;background:linear-gradient(120deg,#c33b67,#ed7190);border-radius:10px;transform-origin:left bottom;transition:transform .8s cubic-bezier(.3,1.4,.5,1),opacity .8s}
.gb .bd:before,.gb .ld:before{content:"";position:absolute;left:50%;margin-left:-11px;top:0;bottom:0;width:22px;background:linear-gradient(90deg,#e8bd62,#ffebae,#d6a13c)}
.gb.open .ld{transform:translate(43px,-100px) rotate(28deg);opacity:0}
.gb.open{opacity:.12;transform:scale(.8);transition:opacity .8s .3s,transform .8s .3s}
.gb.shake{animation:sh .45s infinite}@keyframes sh{25%{rotate:-4deg}75%{rotate:4deg}}
.gold{border-color:rgba(245,213,138,.6);box-shadow:0 0 45px rgba(245,213,138,.12);text-align:center}
.gold h2{font-size:45px;text-align:center;margin:2px 0;color:var(--gold2)}
.rv>*{animation:rv .55s both;animation-delay:calc(var(--i)*.12s)}
@keyframes rv{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}
.chips span{display:inline-block;padding:5px 12px;margin:4px;border-radius:99px;background:rgba(245,213,138,.1);border:1px solid rgba(245,213,138,.28);font-size:13px}
.wi{margin:5px 0;text-align:left;padding:9px 12px 9px 30px;position:relative;background:rgba(255,255,255,.045);border-radius:11px}
.wi:before{content:"✦";position:absolute;left:12px;color:var(--gold)}
#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,25px);max-width:min(90%,520px);padding:13px 19px;border-radius:15px;background:rgba(248,246,239,.96);color:#1a2038;opacity:0;pointer-events:none;transition:.3s;z-index:100;font-weight:800;box-shadow:0 12px 40px rgba(0,0,0,.25);backdrop-filter:blur(15px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* Liquid-glass music player */
#music-player{position:fixed;z-index:90;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(calc(100% - 28px),720px);padding:11px 14px 10px;border:1px solid rgba(255,255,255,.2);border-radius:23px;
 background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.055) 55%,rgba(155,177,255,.09));
 box-shadow:0 18px 55px rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.25);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);
 display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;overflow:visible
}
#music-player:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(110deg,rgba(255,255,255,.12),transparent 32%,transparent 70%,rgba(255,255,255,.08));opacity:.7}
.mp-info{position:relative;display:flex;align-items:center;gap:11px;min-width:0}
.mp-disc{width:39px;height:39px;flex:none;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#f7dfaa 0 12%,#9d315c 13% 48%,#291e37 49% 55%,#d7ad62 56% 60%,#241a30 61%);box-shadow:0 4px 14px #0005}
.mp-disc.playing{animation:discspin 5s linear infinite}
@keyframes discspin{to{transform:rotate(360deg)}}
.mp-meta{min-width:0;text-align:left}
#mp-title{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
#mp-sub{font-size:11px;color:rgba(255,255,255,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-controls{position:relative;display:flex;align-items:center;gap:7px}
.mp-btn{width:36px;height:36px;border:1px solid rgba(255,255,255,.13);border-radius:50%;background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;font-size:16px;cursor:pointer;transition:background .2s,transform .2s}
.mp-btn:hover{background:rgba(255,255,255,.2);transform:scale(1.06)}
.mp-btn.main{width:42px;height:42px;background:linear-gradient(145deg,#f8e3ae,#d9ad62);color:#21182a;border:0;font-size:17px;box-shadow:0 5px 18px rgba(224,185,105,.22)}
.mp-bottom{position:relative;grid-column:1/-1;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
.mp-progress{width:100%;height:4px;margin:0;padding:0;appearance:none;border:0;border-radius:20px;background:rgba(255,255,255,.2);cursor:pointer}
.mp-progress::-webkit-slider-thumb{appearance:none;width:10px;height:10px;border-radius:50%;background:#f7dda4;box-shadow:0 0 0 3px rgba(247,221,164,.15)}
.mp-progress::-moz-range-thumb{width:10px;height:10px;border:0;border-radius:50%;background:#f7dda4}
#mp-time{font-size:10px;color:rgba(255,255,255,.62);font-variant-numeric:tabular-nums;white-space:nowrap}
#mp-list{position:absolute;right:0;top:calc(100% + 13px);width:min(330px,calc(100vw - 32px));max-height:340px;overflow:auto;padding:9px;border:1px solid rgba(255,255,255,.17);border-radius:18px;background:rgba(13,20,43,.92);box-shadow:0 20px 60px rgba(0,0,0,.4);backdrop-filter:blur(24px);display:none}
#mp-list.open{display:block;animation:rise .2s both}
.mp-track{width:100%;display:flex;gap:10px;align-items:center;text-align:left;padding:10px;border:0;border-radius:11px;background:transparent;color:#fff;cursor:pointer;font:inherit}
.mp-track:hover,.mp-track.active{background:rgba(255,255,255,.1)}
.mp-track .num{width:22px;color:var(--gold);font-size:11px;text-align:center}
.mp-track .track-name{min-width:0;font-size:12px;line-height:1.3}
.mp-track .track-name small{font-size:10px;margin-top:2px}
@media(max-width:520px){
 #app{width:min(100% - 26px,620px);padding-top:133px}
 #music-player{width:calc(100% - 18px);top:max(8px,env(safe-area-inset-top));padding:9px 10px;border-radius:19px;gap:7px 9px}
 .mp-disc{width:34px;height:34px}.mp-btn{width:33px;height:33px}.mp-btn.main{width:39px;height:39px}
 .mp-controls{gap:5px}.mp-info{gap:8px}#mp-title{font-size:12px}
 .card{padding:18px;border-radius:21px}.row{gap:8px}.row .btn{padding:12px 8px;font-size:13px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

</style>
</head>
<body>
<div id="music-player" aria-label="Музыкальный плеер">
  <div class="mp-info">
    <div class="mp-disc" id="mp-disc">✦</div>
    <div class="mp-meta">
      <div id="mp-title">Новогодний плейлист</div>
      <div id="mp-sub">Музыка для праздничного настроения</div>
    </div>
  </div>
  <div class="mp-controls">
    <button class="mp-btn" id="mp-prev" title="Предыдущая песня" aria-label="Предыдущая песня">⏮</button>
    <button class="mp-btn main" id="mp-toggle" title="Воспроизвести" aria-label="Воспроизвести">▶</button>
    <button class="mp-btn" id="mp-next" title="Следующая песня" aria-label="Следующая песня">⏭</button>
    <button class="mp-btn" id="mp-list-btn" title="Список музыки" aria-label="Список музыки">☷</button>
    <div id="mp-list" aria-label="Список песен"></div>
  </div>
  <div class="mp-bottom">
    <input id="mp-progress" class="mp-progress" type="range" min="0" max="1000" value="0" aria-label="Позиция воспроизведения">
    <span id="mp-time">0:00 / 0:00</span>
  </div>
  <audio id="mp-audio" preload="metadata"></audio>
</div>
<canvas id="fx"></canvas><i id="demo-hot"></i><main id="app"></main><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
const $=s=>document.querySelector(s),
esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
split=s=>String(s||'').split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean),
sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const sb=supabase.createClient('https://mfwgiedtvutstvnqpscb.supabase.co','sb_publishable_wW4VLW5zIzdfgv_A7WAWgg_U_x6GBdY');
const DEMO='23ec4fa005f3739e8e29c143a7dd18f1772a5f61c89bb3ba11dcf8d7015e7655';
let me=null,chan=null,poll=null,pend=new URLSearchParams(location.search).get('room')||'';
const nick=()=>me?.user_metadata?.nick||'друг';
const TREE='<svg class="tree" viewBox="0 0 120 138"><path d="M60 14L88 56H32zM60 38L96 90H24zM60 66L104 122H16z" fill="#1f6b4f"/><rect x="53" y="120" width="14" height="14" fill="#6b3f26"/><path d="M60 0l3.5 8 8.5.5-6.5 5.5 2 8.5-7.5-4.5-7.5 4.5 2-8.5L48 8.5l8.5-.5z" fill="#f0c96a"/><g class="lt"><circle cx="52" cy="48" r="3" fill="#e04a6f"/><circle cx="68" cy="56" r="3" fill="#f0c96a"/><circle cx="46" cy="72" r="3" fill="#fff"/><circle cx="64" cy="82" r="3" fill="#e04a6f"/><circle cx="80" cy="96" r="3" fill="#f0c96a"/><circle cx="38" cy="106" r="3" fill="#fff"/><circle cx="60" cy="110" r="3" fill="#e04a6f"/><circle cx="88" cy="114" r="3" fill="#fff"/></g></svg>';

function toast(m){const t=$('#toast');t.textContent=m;t.className='show';clearTimeout(t._t);t._t=setTimeout(()=>t.className='',3600)}
function guard(f){return async function(){const b=this;b.disabled=true;try{await f()}catch(e){toast(e.message||'Что-то пошло не так')}b.disabled=false}}
function clean(){if(chan){sb.removeChannel(chan);chan=null}clearInterval(poll)}
function show(a,html){clean();$('#app').innerHTML='<section class="scr" data-a="'+a+'">'+html+'</section>';scrollTo(0,0)}
const getRoom=async id=>(await sb.from('rooms').select('*').eq('id',id).single()).data;
const fmt=d=>new Date(d+'T12:00').toLocaleDateString('ru',{day:'numeric',month:'long'});
const openRoom=r=>r.status==='drawn'?reveal(r,false):lobby(r);

/* ---------- вход и регистрация ---------- */
function auth(reg){
  show('rise',TREE+'<h1>Тайный Санта</h1><p class="sub">'+(reg?'Создай аккаунт, это нужно один раз':'С возвращением! Войди в аккаунт')+'</p><div class="card"><input id="n" placeholder="Ник" maxlength="20" autocomplete="username"><input id="p" type="password" placeholder="Пароль (от 6 символов)" autocomplete="'+(reg?'new-password':'current-password')+'"><button class="btn" id="go">'+(reg?'Зарегистрироваться':'Войти')+'</button><button class="lnk" id="sw">'+(reg?'Уже есть аккаунт? Войти':'Впервые здесь? Регистрация')+'</button></div>');
  $('#sw').onclick=()=>auth(!reg);
  $('#go').onclick=guard(async()=>{
    const n=$('#n').value.trim(),p=$('#p').value;
    if(n.length<2)return toast('Ник: от 2 символов');
    if(p.length<6)return toast('Пароль: от 6 символов');
    const email=(await sha(n.toLowerCase()))+'@santa-nick.app';
    const r=reg?await sb.auth.signUp({email,password:p,options:{data:{nick:n}}}):await sb.auth.signInWithPassword({email,password:p});
    if(r.error)return toast(reg?(/registered|exists/i.test(r.error.message)?'Этот ник уже занят':r.error.message):'Неверный ник или пароль');
    if(!r.data.session)return toast('В Supabase отключи подтверждение почты (Confirm email)');
    me=r.data.user;enter();
  });
}
function enter(){if(pend){const q=pend;pend='';join(q)}else home()}

/* ---------- главный экран ---------- */
async function home(){
  const {data:rs}=await sb.from('rooms').select('id,name,status,creator_id,exchange_date,created_at').order('created_at',{ascending:false});
  const d=Math.ceil((new Date(new Date().getFullYear()+1,0,1)-new Date())/864e5),m=d%10,w=m==1&&d%100!=11?'день':(m>1&&m<5&&(d%100<12||d%100>14))?'дня':'дней';
  show('zoom',TREE+'<h1>Привет, '+esc(nick())+'!</h1><p class="sub">До Нового года '+d+' '+w+'</p><div class="row"><button class="btn" id="bc">Создать комнату</button><button class="btn alt" id="bj">Войти в комнату</button></div>'+((rs||[]).length?'<h2>Твои комнаты</h2>'+rs.map((r,i)=>'<button class="room" data-i="'+i+'"><b>'+esc(r.name)+'</b><small>'+(r.status==='drawn'?'Жеребьёвка прошла':'Идёт набор участников')+'</small></button>').join(''):'')+'<button class="lnk" id="out">Выйти из аккаунта</button>');
  $('#bc').onclick=create;$('#bj').onclick=()=>join('');
  document.querySelectorAll('.room').forEach(b=>b.onclick=()=>openRoom(rs[b.dataset.i]));
  $('#out').onclick=()=>{sb.auth.signOut({scope:'local'}).catch(()=>{});me=null;auth(false)};
}

/* ---------- создать / войти в комнату ---------- */
function create(){
  show('unfold','<h1>Новая комната</h1><p class="sub">Друзья войдут по названию и паролю</p><div class="card"><input id="rn" placeholder="Название комнаты" maxlength="40"><input id="rp" placeholder="Пароль комнаты (от 4 символов)" maxlength="72"><label>Дата обмена подарками (необязательно)</label><input id="rd" type="date"><button class="btn" id="go">Создать</button><button class="lnk" id="bk">← Назад</button></div><small>Запомни пароль: восстановить его нельзя</small>');
  $('#bk').onclick=home;
  $('#go').onclick=guard(async()=>{
    const {data,error}=await sb.rpc('create_room',{p_name:$('#rn').value,p_password:$('#rp').value,p_date:$('#rd').value||null});
    if(error)return toast(error.message);
    profile(await getRoom(data));
  });
}
function join(pre){
  show('doors','<h1>Вход в комнату</h1><p class="sub">Название и пароль даст организатор</p><div class="card"><input id="jn" placeholder="Название комнаты" maxlength="40" value="'+esc(pre)+'"><input id="jp" placeholder="Пароль комнаты" maxlength="72"><button class="btn" id="go">Войти</button><button class="lnk" id="bk">← Назад</button></div>');
  $('#bk').onclick=home;
  $('#go').onclick=guard(async()=>{
    const {data:id,error}=await sb.rpc('join_room',{p_name:$('#jn').value,p_password:$('#jp').value});
    if(error)return toast(error.message);
    const r=await getRoom(id);
    if(r.status==='drawn')return reveal(r,false);
    const {data:m}=await sb.from('members').select('filled').eq('room_id',id).eq('user_id',me.id).single();
    m&&m.filled?lobby(r):profile(r);
  });
}

/* ---------- анкета ---------- */
async function profile(r){
  const {data:w}=await sb.from('wishes').select('interests,wishlist').eq('room_id',r.id).maybeSingle();
  show('paper','<h1>Твоя анкета</h1><p class="sub">Комната «'+esc(r.name)+'». Это увидит только тот, кто будет тебе дарить</p><div class="card"><label>Интересы, через запятую</label><textarea id="i" maxlength="1000" placeholder="кофе, футбол, настолки">'+esc(w&&w.interests)+'</textarea><div class="chips" id="chp"></div><label>Что бы хотелось получить</label><textarea id="w" maxlength="2000" placeholder="Каждое с новой строки. Это только подсказки, дарить именно это необязательно">'+esc(w&&w.wishlist)+'</textarea><button class="btn" id="sv">Готово</button></div>');
  const chp=()=>$('#chp').innerHTML=split($('#i').value).map(x=>'<span>'+esc(x)+'</span>').join('');
  $('#i').oninput=chp;chp();
  $('#sv').onclick=guard(async()=>{
    const {error}=await sb.rpc('save_wishes',{p_room:r.id,p_interests:$('#i').value,p_wishlist:$('#w').value});
    if(error)return toast(error.message);
    lobby(r);
  });
}

/* ---------- закрыть комнату (только создатель) ---------- */
async function closeRoom(r){
  if(!confirm('Закрыть комнату «'+r.name+'»? Участники и анкеты будут удалены, отменить это нельзя'))return;
  const {error}=await sb.rpc('delete_room',{p_room:r.id});
  if(error)return toast(error.message);
  toast('Комната закрыта');home();
}

/* ---------- лобби ---------- */
function lobby(r){
  const boss=r.creator_id===me.id;
  show('drop','<h1>'+esc(r.name)+'</h1><p class="sub">'+(r.exchange_date?'Обмен подарками: '+fmt(r.exchange_date):'Ждём всех участников')+'</p><div class="balls" id="balls"></div><p class="sub" id="cnt"></p><div id="act"></div><button class="btn alt" id="ed">Изменить анкету</button><button class="btn alt" id="cp">Скопировать ссылку-приглашение</button>'+(boss?'<button class="btn alt" id="cl">Закрыть комнату</button>':'')+'<button class="lnk" id="bk">← К моим комнатам</button>');
  $('#ed').onclick=()=>profile(r);$('#bk').onclick=home;
  if(boss)$('#cl').onclick=()=>closeRoom(r);
  $('#cp').onclick=()=>{navigator.clipboard.writeText(location.origin+location.pathname+'?room='+encodeURIComponent(r.name)).then(()=>toast('Ссылка скопирована. Пароль отправь отдельно'),()=>toast('Не удалось скопировать'))};
  let ms=[];
  const load=async()=>{
    const [a,b]=await Promise.all([sb.from('members').select('user_id,nick,filled').eq('room_id',r.id).order('joined_at'),sb.from('rooms').select('status').eq('id',r.id).single()]);
    if(!a.data)return;
    if(b.data&&b.data.status==='drawn')return reveal(r,true);
    ms=a.data;
    if(!ms.some(m=>m.user_id===me.id)){toast('Ты больше не в этой комнате: её закрыли или тебя убрали');return home()}
    const box=$('#balls');if(!box)return;
    const ids=new Set(ms.map(m=>m.user_id));
    [...box.children].forEach(e=>{if(!ids.has(e.dataset.u))e.remove()});
    ms.forEach((m,i)=>{
      let e=box.querySelector('[data-u="'+m.user_id+'"]');
      if(!e){e=document.createElement('button');e.dataset.u=m.user_id;e.className='ball hang c'+(i%5);box.append(e)}
      e.classList.toggle('f',m.filled);
      e.innerHTML='<span>'+esc(m.nick.slice(0,2))+(boss&&m.user_id!==me.id?'<i class="x">×</i>':'')+'</span><small>'+esc(m.nick)+(m.user_id===r.creator_id?' ★':'')+'</small>';
      e.onclick=async()=>{if(boss&&m.user_id!==me.id&&confirm('Удалить '+m.nick+' из комнаты?')){const {error}=await sb.rpc('kick_member',{p_room:r.id,p_user:m.user_id});error?toast(error.message):load()}};
    });
    const f=ms.filter(m=>m.filled).length;
    $('#cnt').textContent='В комнате: '+ms.length+'. Анкету заполнили: '+f;
    const act=$('#act');
    if(boss){
      if(!act.firstChild){act.innerHTML='<button class="btn" id="st">Начать игру</button><small>Нажми, когда все зашли. Чтобы убрать участника, нажми × на его шаре</small>';
        $('#st').onclick=guard(async()=>{
          if(ms.some(m=>!m.filled)&&!confirm('Не все заполнили анкету. Начать всё равно?'))return;
          if(!confirm('Начать жеребьёвку? После старта новые люди зайти не смогут'))return;
          const {error}=await sb.rpc('start_game',{p_room:r.id});
          if(error)return toast(error.message);
          reveal(r,true);
        })}
      $('#st').disabled=ms.length<3;
    }else if(!act.firstChild)act.innerHTML='<p class="pulse">Организатор скоро запустит жеребьёвку…</p>';
  };
  chan=sb.channel('room-'+r.id)
    .on('postgres_changes',{event:'*',schema:'public',table:'members',filter:'room_id=eq.'+r.id},load)
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'rooms',filter:'id=eq.'+r.id},load)
    .subscribe();
  poll=setInterval(load,5000);
  load();
}

/* ---------- жеребьёвка и подарок ---------- */
async function reveal(r,live){
  const {data,error}=await sb.rpc('get_my_target',{p_room:r.id});
  if(error||!data||!data.length){toast(error?error.message:'Пара пока не найдена');return home()}
  gift(data[0],home,live);
  if(r.creator_id===me.id){$('#bk').insertAdjacentHTML('afterend','<button class="lnk" id="cl">Закрыть комнату</button>');$('#cl').onclick=()=>closeRoom(r)}
}
function gift(t,back,live){
  show('spark','<h1>'+(live?'Жеребьёвка!':'Твой подопечный')+'</h1><div class="gb'+(live?' shake':'')+'" id="gb"><div class="ld"></div><div class="bd"></div></div><p class="sub" id="gs">'+(live?'3':'Нажми на подарок')+'</p><div id="res"></div><button class="lnk" id="bk">← Назад</button>');
  const gb=$('#gb'),gs=$('#gs'),res=$('#res');let ready=!live,done=0;
  if(live){let c=3;const iv=setInterval(()=>{c--;if(c>0)gs.textContent=c;else{clearInterval(iv);gs.textContent='Нажми на подарок';gb.classList.remove('shake');ready=true}},800)}
  gb.onclick=()=>{
    if(!ready||done)return;done=1;gb.classList.add('open');burst();gs.textContent='';
    setTimeout(()=>{
      const it=split(t.interests),wl=String(t.wishlist||'').split('\n').map(x=>x.trim()).filter(Boolean);
      res.innerHTML='<div class="card gold rv"><small style="--i:0">Ты даришь подарок</small><h2 style="--i:1">'+esc(t.nick)+'</h2><label style="--i:2">Интересы</label><div class="chips" style="--i:3">'+(it.length?it.map(x=>'<span>'+esc(x)+'</span>').join(''):'<em>Ничего не написал</em>')+'</div><label style="--i:4">Может обрадоваться</label><div style="--i:5">'+(wl.length?wl.map(x=>'<p class="wi">'+esc(x)+'</p>').join(''):'<em>Список пуст, придумай сюрприз</em>')+'</div><small style="--i:6">Это только подсказки, дарить именно это необязательно</small></div>';
    },700);
  };
  $('#bk').onclick=back;
}

/* ---------- скрытое демо ---------- */
let D=[],T=null,tp=[];
$('#demo-hot').onclick=async()=>{
  const t=Date.now();tp=tp.filter(x=>t-x<900);tp.push(t);
  if(tp.length<3)return;tp=[];
  const p=prompt('Пароль');if(p===null)return;
  if(await sha(p)===DEMO)demo();else toast('Неверный пароль');
};
function demo(){
  const list='<div class="balls">'+D.map((x,i)=>'<button class="ball hang f c'+(i%5)+'" data-i="'+i+'"><span>'+esc(x.n.slice(0,2))+'</span><small>'+esc(x.n)+'</small></button>').join('')+'</div>';
  if(T){
    show('zoom','<h1>Демо: итоги</h1><p class="sub">Посмотри глазами участника</p><div class="balls">'+D.map((x,i)=>'<button class="ball hang f c'+(i%5)+'" data-v="'+i+'"><span>'+esc(x.n.slice(0,2))+'</span><small>'+esc(x.n)+'</small></button>').join('')+'</div><button class="btn alt" id="rs">Начать заново</button><button class="lnk" id="ex">← Выйти из демо</button>');
    document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const k=+b.dataset.v,o=D[T[k]];gift({nick:o.n,interests:o.i,wishlist:o.w},demo,true)});
    $('#rs').onclick=()=>{D=[];T=null;demo()};
  }else{
    show('zoom','<h1>Демо</h1><p class="sub">Ничего не сохраняется, всё только в этой вкладке</p><div class="card"><input id="dn" placeholder="Имя" maxlength="20"><textarea id="di" placeholder="Интересы через запятую"></textarea><textarea id="dw" placeholder="Подарки, каждый с новой строки"></textarea><button class="btn" id="da">Добавить участника</button></div>'+list+'<small>Нажми на шар, чтобы убрать участника</small><button class="btn" id="dg"'+(D.length<3?' disabled':'')+'>Жеребьёвка (от 3 человек)</button><button class="lnk" id="ex">← Выйти из демо</button>');
    $('#da').onclick=()=>{const n=$('#dn').value.trim();if(!n)return toast('Впиши имя');D.push({n,i:$('#di').value,w:$('#dw').value});demo()};
    document.querySelectorAll('.ball').forEach(b=>b.onclick=()=>{D.splice(+b.dataset.i,1);demo()});
    $('#dg').onclick=()=>{const o=D.map((_,i)=>i).sort(()=>Math.random()-.5);T={};o.forEach((g,i)=>T[g]=o[(i+1)%o.length]);demo()};
  }
  $('#ex').onclick=()=>{D=[];T=null;me?home():auth(false)};
}

/* ---------- снег и конфетти ---------- */
const cv=$('#fx'),cx=cv.getContext('2d');let W,H,F=[],C=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',rs);rs();
for(let i=0;i<(innerWidth<600?40:90);i++)F.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*.8+.2,p:Math.random()*6});
function burst(){const k=['#f0c96a','#e04a6f','#fff','#4fbf8f','#7aa7ff'];for(let i=0;i<120;i++){const a=Math.random()*6.28,s=3+Math.random()*7;C.push({x:W/2,y:H*.4,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,l:90+Math.random()*60,r:0,vr:Math.random()*.3,c:k[i%5]})}}
function loop(){
  cx.clearRect(0,0,W,H);cx.fillStyle='#fff';
  for(const f of F){f.y+=f.z*1.1;f.p+=.01;f.x+=Math.sin(f.p)*.4*f.z;if(f.y>H+5){f.y=-5;f.x=Math.random()*W}cx.globalAlpha=.3+f.z*.6;cx.beginPath();cx.arc(f.x,f.y,f.z*2.4,0,7);cx.fill()}
  cx.globalAlpha=1;C=C.filter(c=>c.l>0);
  for(const c of C){c.x+=c.vx;c.y+=c.vy;c.vy+=.12;c.vx*=.99;c.l--;c.r+=c.vr;cx.save();cx.translate(c.x,c.y);cx.rotate(c.r);cx.fillStyle=c.c;cx.fillRect(-3,-2,6,4);cx.restore()}
  requestAnimationFrame(loop);
}
if(!matchMedia('(prefers-reduced-motion:reduce)').matches)loop();


/* ---------- новогодний музыкальный плеер ---------- */
const playlist = [
  {title:"Frosty The Snowman",artist:"Ella Fitzgerald",file:"music/Frosty The Snowman - Ella Fitzgerald.mp3"},
  {title:"I Wish You A Merry Christmas",artist:"Bing Crosby",file:"music/I Wish You A Merry Christmas - Bing Crosby.mp3"},
  {title:"Last Christmas",artist:"Wham!",file:"music/Last Christmas - Wham!.mp3"},
  {title:"Let It Snow, Let It Snow, Let It Snow",artist:"Dean Martin",file:"music/Let It Snow - Dean Martin.mp3"},
  {title:"Magic Moments",artist:"Perry Como",file:"music/Magic Moments - Perry Como.mp3"},
  {title:"Зима-холода",artist:"Андрей Губин",file:"music/Зима-холода - Андрей Губин.mp3"},
  {title:"Новогодняя",artist:"Дискотека Авария",file:"music/Новогодняя - Дискотека Авария.mp3"}
];
const playerAudio=$('#mp-audio'), playerTitle=$('#mp-title'), playerSub=$('#mp-sub'),
      playerToggle=$('#mp-toggle'), playerDisc=$('#mp-disc'), playerProgress=$('#mp-progress'),
      playerTime=$('#mp-time'), playerList=$('#mp-list');
let trackIndex=0, seeking=false;
const timeFmt=s=>{if(!Number.isFinite(s))return'0:00';const m=Math.floor(s/60),v=Math.floor(s%60);return m+':'+String(v).padStart(2,'0')};
function renderPlaylist(){
  playerList.innerHTML=playlist.map((t,i)=>'<button class="mp-track '+(i===trackIndex?'active':'')+'" data-track="'+i+'"><span class="num">'+(i===trackIndex?'♫':String(i+1).padStart(2,'0'))+'</span><span class="track-name">'+esc(t.title)+'<small>'+esc(t.artist)+'</small></span></button>').join('');
  playerList.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>{loadTrack(+b.dataset.track,true);playerList.classList.remove('open')});
}
function loadTrack(i,autoplay=false){
  trackIndex=(i+playlist.length)%playlist.length;
  const t=playlist[trackIndex];playerAudio.src=t.file;playerTitle.textContent=t.title;playerSub.textContent=t.artist;
  playerProgress.value=0;playerTime.textContent='0:00 / 0:00';renderPlaylist();
  if(autoplay)playTrack();
  else{playerToggle.textContent='▶';playerDisc.classList.remove('playing')}
}
async function playTrack(){
  try{await playerAudio.play();playerToggle.textContent='Ⅱ';playerToggle.title='Пауза';playerDisc.classList.add('playing')}
  catch(e){toast('Не удалось воспроизвести файл. Проверь папку music');playerToggle.textContent='▶';playerDisc.classList.remove('playing')}
}
function pauseTrack(){playerAudio.pause();playerToggle.textContent='▶';playerToggle.title='Воспроизвести';playerDisc.classList.remove('playing')}
playerToggle.onclick=()=>playerAudio.paused?playTrack():pauseTrack();
$('#mp-prev').onclick=()=>loadTrack(trackIndex-1,true);
$('#mp-next').onclick=()=>loadTrack(trackIndex+1,true);
$('#mp-list-btn').onclick=()=>playerList.classList.toggle('open');
playerAudio.addEventListener('timeupdate',()=>{
 if(!seeking&&Number.isFinite(playerAudio.duration)&&playerAudio.duration>0)playerProgress.value=Math.round(playerAudio.currentTime/playerAudio.duration*1000);
 playerTime.textContent=timeFmt(playerAudio.currentTime)+' / '+timeFmt(playerAudio.duration);
});
playerProgress.addEventListener('input',()=>{seeking=true});
playerProgress.addEventListener('change',()=>{if(Number.isFinite(playerAudio.duration))playerAudio.currentTime=(+playerProgress.value/1000)*playerAudio.duration;seeking=false});
playerAudio.addEventListener('ended',()=>loadTrack(trackIndex+1,true));
playerAudio.addEventListener('play',()=>{playerToggle.textContent='Ⅱ';playerDisc.classList.add('playing')});
playerAudio.addEventListener('pause',()=>{playerToggle.textContent='▶';playerDisc.classList.remove('playing')});
loadTrack(0,false);

/* ---------- старт ---------- */
(async()=>{
  const {data}=await sb.auth.getSession();
  if(data.session){me=data.session.user;enter()}else auth(false);
})();
</script>
